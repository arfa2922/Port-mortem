# Two bugs found in the UPSTREAM original, both by testing a documented
# contract rather than comparing outputs:
#
#   1. simplifyRange returns "" when nothing satisfies the range, and ""
#      parses as `*` — so a range matching nothing simplifies to one
#      matching everything.
#   2. gtr and ltr both return true for a prerelease excluded by the
#      prerelease rule rather than by the range's bounds — the version is
#      reported as above and below the same range at once.
#
# Root causes, reproductions, and suggested patches in UPSTREAM_BUG.md.
# This port diverges deliberately on both, each with a regression test.
bug_catcher = true
upstream_bug_report = "UPSTREAM_BUG.md"
upstream_bugs_found = 2

# Seventeen divergences found in THIS port by the oracle, each fixed.
# Full reasoning for every one is in DECISIONS.md SS7 (the first nine),
# SS14 (six more in a later round), SS15 (one more, correcting SS14's
# #14), and SS16 (one more still -- found independently by someone
# running this port's own fuzzer on their own machine, a real second
# confirmation of the oracle methodology).
#   1.  loose mode coerces leading zeros in prerelease identifiers
#   2.  a trailing hyphen is itself an identifier
#   3.  the loose grammar backtracks across the patch component
#   4.  oversized components can still parse once that split applies
#   5.  an unusable alternative poisons the whole range
#   6.  the hyphen-range pattern is anchored to the whole set
#   7.  loose mode accepts a prerelease with no separating hyphen
#   8.  unreadable tokens are dropped, oversized ones are fatal
#   9.  an uppercase V short-circuits the overflow check
#   10. ^= and ~= accept a leading = after the sugar character
#   11. duplicate alternatives are never collapsed (a divergence this
#       port had itself introduced, motivated by a performance concern
#       the original doesn't actually have -- see DECISIONS.md SS8)
#   12. an entirely-unreadable alternative is dropped from the union,
#       not just a token within one
#   13. a sugar function returning "" (a successful desugar to ANY)
#       must be pushed as an explicit comparator, not left to a string
#       split that yields nothing for an empty string
#   14. == is a valid spelling of =, but only in loose mode -- the
#       opposite of the initially-assumed rule
#   15. the hyphen range's right side accepts a leading = only when
#       that side's version carries a prerelease tag -- the left side
#       never accepts a leading = at all, in any mode (corrects an
#       earlier, too-broad version of this same rule)
#   16. a null-set alternative (e.g. from '>1 >*') was wrongly dropped
#       when it was the only alternative left after another was
#       separately dropped for being unreadable, instead of surviving
#       to become the final answer as it does when written alone
#   17. ^00 / ~00 / 00.x (leading-zero major) keep an explicit >=0.0.0
#       lower bound that ^0 / ~0 / 0.x (bare zero) drop, even though
#       both parse to the identical major -- the distinction only
#       exists in the raw text before coercion

