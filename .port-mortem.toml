# Port Mortem 2026 — submission metadata

track = "F"  # corrected from H (open pair) -- JS -> Rust is a named Track F pair; see DECISIONS.md SS23
source_url = "https://github.com/npm/node-semver"
source_language = "javascript"
target_language = "rust"
source_loc = 2874

# The original's own test suite, pinned at kickoff. CI re-fetches and
# compares against this hash; any difference fails the build.
kickoff_hash_file = "kickoff.hash"
pinned_files = 112

test_pass_rate = "71/71 native Rust tests (44 unit + 13 fixture + 10 property + 4 doc); see [behavioral_equivalence] below for how equivalence with the original's own 2515-test suite is actually established -- via a live differential oracle, not by running the original's JS suite in-process against this port (no such adapter exists in this repo)"
api_coverage = "41/41 exports"
unsafe_count = 0
unsafe_enforcement = "compiler error via #![forbid(unsafe_code)] in src/lib.rs, not just a grep check -- cannot be locally silenced with #[allow(unsafe_code)], verified by deliberately trying. Re-confirmed on the second-machine verification pass (DECISIONS.md SS23): grep -rPn '^\\s*unsafe\\s' across src/, web/wasm/src/, examples/, and fuzz/ returns zero matches, and cargo clippy --release --all-targets -- -D warnings passes with zero warnings"
missing_docs_lint = "#![warn(missing_docs)] in src/lib.rs -- 57 undocumented public items found and closed, verified at 0 remaining by forced rebuild; see DECISIONS.md SS19"
doc_tests = "4 (was 0) -- caught a stale doc comment on compare() that claimed it panics when it actually returns Result::Err; see DECISIONS.md SS20"
windows_gap_found_on_real_machine = "All scripts/*.sh are bash-only; a real Windows run without WSL/Git Bash hit this directly. scripts/fetch_original.ps1 and scripts/run_differential.ps1 added as PowerShell equivalents, producing byte-identical kickoff.hash format, and confirmed working on a real Windows machine (cargo test: 71/71 passed; cargo clippy --release --all-targets -- -D warnings: clean). The one gap found there was scripts/bench.sh itself, which has no PowerShell equivalent and depends on bash; scripts/bench.ps1 was added afterward to close that gap. A second real gap surfaced running bench.ps1 on that same machine: none of the .ps1 files are signed, so the default Windows execution policy refuses to run them with a bare 'powershell -File ...' -- 'UnauthorizedAccess: ... is not digitally signed'. Fixed by documenting '-ExecutionPolicy Bypass' on every invocation in README rather than leaving the reader to discover it themselves. bench.ps1's own output has NOT yet been compared against the committed bench/results.json numbers on that machine -- written by tracing the bash original's logic, believed correct, disclosed as untested rather than claimed verified. See DECISIONS.md SS21."

build_command = "cargo build --release"
test_command = "cargo test"
docker = "docker build -t semver-rs . && docker run --rm semver-rs"

[layout]
# Per the event's "Anatomy of a working port" spec.
readme = "README.md"
decisions = "DECISIONS.md"
dockerfile = "Dockerfile"
source = "src/"
tests_original = "tests/original/"
tests_port = "tests/port/  -- see tests/port/README.md; native tests live in #[cfg(test)] per Rust convention, this file explains where"
fuzz_harness = "fuzz/harness.rs"
fuzz_log = "fuzz/log.txt"
bench_methodology = "bench/methodology.md"
bench_results = "bench/results.json"
bench_script = "scripts/bench.sh (bash) / scripts/bench.ps1 (PowerShell, added later -- see windows_gap_found_on_real_machine)"
# Supplementary, not part of the anatomy spec and not required to
# evaluate the port -- src/ never depends on either of these.
web_dashboard = "web/dashboard.html -- static, opens directly, no build"
web_demo = "web/demo.html -- interactive WASM demo, needs build-wasm.sh first (see web/README.md)"

[fixture_parity]
# Every fixture the original ships, asserted against directly. The JSON
# is a mechanical export of the pinned files — no hand-curation.
valid_versions = "139/139"
invalid_versions = "7/7"
comparisons = "93/93"
equality = "74/74"
increments = "133/133"
range_parse = "133/133"
range_include = "126/126"
range_exclude = "97/97"
comparator_intersection = "34/34"
range_intersection = "54/54"
truncations = "27/27"
# Properties the original does not test, because a fixture list only
# compares pairs it was given.
ordering_is_total_order = "1406/1406"
canonical_round_trip = "192/192"

[mutation_testing]
# Manually curated, not an automated tool (no cargo-mutants run).
# scripts/mutation_test.py: applies each mutation, runs the fixture
# suite, reverts in a finally block regardless of outcome.
count = 4
caught = 4
tool = "manual (scripts/mutation_test.py)"
mutations = [
    "reverse prerelease precedence",
    "swap numeric-vs-alphanumeric ordering",
    "reverse main version comparison",
    "invert null-set check in a comparator set",
]

[property_tests]
# tests/properties.rs, proptest-based, random inputs per run (not a
# fixed list). All ten hold on every run so far.
count = 10
tool = "proptest"
properties = [
    "reflexivity",
    "antisymmetry",
    "transitivity",
    "parse_never_panics",
    "canonical_form_round_trips",
    "build_metadata_never_affects_precedence",
    "range_parsing_never_panics",
    "satisfies_never_panics",
    "satisfies_ignores_build_metadata",
    "max_satisfying_result_always_satisfies",
]

[behavioral_equivalence]
# The original is run live as an oracle: both implementations receive
# the same input and their answers are compared.
oracle = "vendor/node-semver, executed via node"
version_level_cases = 500000
version_level_divergences = 0
range_level_divergence_rate = "~0.004-0.0051% on adversarial input"
# History of this number as more range-level rules were found and
# fixed by asking the original directly, rather than only keeping the
# final best-looking figure:
range_level_divergence_history = [
    "0.16% (129/20,000) after DECISIONS.md SS7 -- first 9 divergences",
    "0.028% (291/1,024,000) after DECISIONS.md SS14 first batch",
    "0.0078% (181/1,030,000) after DECISIONS.md SS14 second batch -- the == operator rule",
    "0.0074% (37/500,000 multi-seed) after DECISIONS.md SS15",
    "0.004-0.0051% (20/500,000 multi-seed, 47/922,000 continuous) after DECISIONS.md SS16 -- current, one small divergence remains and is documented",
]
divergences_found_and_fixed = 17
# The SS16 fix (^00 vs ^0) was found and reported by someone running
# this port's own fuzzer independently on their own machine -- a real
# second confirmation of the oracle methodology, not just this
# session's own testing.
independently_reproduced = true
known_remaining_gaps = 1
known_remaining_gaps_note = "Documented at the end of DECISIONS.md SS16, not hidden: hyphen-range + leading-= handling has one remaining unresolved edge in how a leading '=' combines with includePrerelease and build-metadata-only (no prerelease tag) inputs. A fresh 500k-case run (seeds 1/7/42/99/555/1337/2026/8888/31337/99999) confirms this is a single narrow feature area, not a new class of bug -- but it recurs across several concrete variants (both ip=true and ip=false, and in both directions: the port is sometimes too strict, sometimes too permissive relative to the original), so 'one' should be read as one underlying rule gap with multiple surface manifestations, not literally one input. Full seed-by-seed detail in fuzz/differential-multiseed.log."

