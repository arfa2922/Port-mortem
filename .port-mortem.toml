[robustness]
# examples/api_stress.rs and examples/timing_safety.rs, both gated in CI.
hostile_api_calls = 47
panics = 0
worst_case_timing_ms = 27  # on the reference machine bench/results.json came from; see timing_budget_calibration below for why this doesn't transfer as an absolute figure
# Two O(n^2) duplicate-check bugs, same root pattern, different functions:
# 1. Range::parse deduplicating alternatives (||-parts) -- 4.4s -> 12ms on
#    a 5,000-alternative range. Found by timing, not any fixture.
# 2. Range::parse_comparator_set deduplicating comparators within one
#    alternative -- 61.9ms -> under budget on a 5,000-comparator set.
#    Found on a second-machine verification pass (DECISIONS.md SS22),
#    the sibling of bug 1 that bug 1's fix never touched.
performance_bugs_found = 2

# examples/timing_safety.rs used a fixed 50ms budget for every case. On
# a real Windows machine benchmarking ~4.2x slower on raw parsing than
# the reference machine (2.68M vs 11.4M parses/sec, see bench numbers
# above), two already-linear-time cases ("5k range alternatives", 60ms;
# "satisfies against 5k alternatives", 51ms) exceeded the fixed budget
# for no reason but hardware speed -- a false failure, not a regression,
# and one that risked also failing on GitHub Actions' shared runners.
# Fixed: the example now measures its own baseline parse cost at
# startup and scales the budget proportionally against the reference
# machine's 77ns/parse figure (never tightening below the 50ms
# reference, only loosening on slower hardware), so the check verifies
# algorithmic complexity rather than one developer's clock speed.
timing_budget_calibration = "runtime-calibrated against reference 77ns/parse baseline, was a fixed 50ms -- see examples/timing_safety.rs and its module doc comment"

